name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Installer les dépendances
        run: python -m pip install -r requirements-dev.txt
      - name: Lancer les tests
        run: python -m pytest
      - name: Vérifier la syntaxe du JavaScript
        run: for f in static/js/*.js; do node --check "$f"; done

  sources-en-ligne:
    # Vérifie chaque lundi que HelloWork, LinkedIn et Welcome to the Jungle répondent toujours
    # comme attendu (un site qui change de structure casse la recherche automatique).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests/test_live.py
        env:
          RUN_LIVE: "1"
